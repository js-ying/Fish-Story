	<script src="js/album_check.js"></script>

<script type="text/javascript">

	var build = function(data) {
		// 依專輯名稱取得專輯資料
		var findAlbum = function(albumName) {
			return data.album.filter(function(cv) {
				return cv.album_name == albumName;
			})[0];
		};

		data.album.forEach(function(cv, i, array) {
			var templete = "<div class=\"hover_black\" data-name=\"" + cv.album_name + "\" data-toggle=\"popover\" data-placement=\"bottom\" tabindex=\"0\" data-trigger=\"focus\"><img class=\"img-responsive img-thumbnail " + type(cv.album_type) + "\" img-name=\"" + cv.album_name + "\" src=\"" + cv.album_img + "\"></div>"
			$("#albums-display").append(templete);
		});

		// popover 標題與歌曲清單於顯示當下依該專輯產生
		$('[data-toggle="popover"]').popover({
			html:true,
			delay:{show:100},
			title: function(){
				var album = findAlbum($(this).data('name'));
				return '<div><span class="popover_title_span">' + album.album_name + '</span><span class="popover_albumtype_span"><small><span class="label ' + label_type(album.album_type) + '">' + album.album_type + '</span><br>' + album.album_date + '</small></span></div>';
			},
			content: function() {
				var album = findAlbum($(this).data('name'));
				var songList = album.album_info.map(function(v) {
					return "<li class=\"song\" data-albumname=\"" + album.album_name + "\" data-songname=\"" + v.song_name + "\"><a href=\"#\" data-toggle=\"modal\" data-target=\"#myModal\">" + v.song_name + "</a></li>";
				}).join('');
				return '<ul class="popover-song-list">' + songList + '</ul>';
			}
		});

		// 以事件委派處理歌曲點擊，popover 動態產生的 .song 也能觸發
		$(document).on('click', '.song', function() {
			var songName = $(this).data('songname')
			var albumName = $(this).data('albumname')
			var song = findAlbum(albumName).album_info.filter(function(cv) {
				return cv.song_name == songName;
			})[0];

			$(".modal-title").html(song.song_name);
			$(".song-writer-value").html(song.song_info[0].writer);
			$(".song-composer-value").html(song.song_info[0].composer);
			$(".song-content-value").html(song.song_info[0].content.replace(/\n/g, "<br />"));
		});
	};

	$.ajax({
		url: 'js/album.json',
		dataType: 'json'
	}).done(build);

	$(document).ready(function() {
		$('#album').fadeIn(500);
		$('#myModal').on('shown.bs.modal', function () {
			$('#myInput').focus();
		});

		y = $(window).width();

			alert("已知移動裝置觀看本頁面會有錯誤，請先觀看「展開專輯」裡面的內容！");
		}
	});

</script>
