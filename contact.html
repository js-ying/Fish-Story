		  	</div>

		  	</div>

		    	</div>
		  	</div>
		  	<br />
		  	<div class="form-group">
		    	<div class="col-sm-offset-3 col-lg-7">

		    	</div>
		  	</div>

<script>
	$(document).ready(function() {

		var mail = ["hi", "jsy.tw"].join("@");
		$("#contact-mail").attr("data-mail", mail);
	});
</script>
